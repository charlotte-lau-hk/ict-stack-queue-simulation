<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stack &amp; Queue Simulator</title>
<style>
  :root {
    --bg: #f3f5fa;
    --panel: #ffffff;
    --ink: #1e293b;
    --muted: #64748b;
    --border: #d5dbe5;
    --line: #475569;
    --accent: #2563eb;
    --accent-ink: #ffffff;
    --stack: #2563eb;
    --stack-bg: #dbeafe;
    --queue: #0f766e;
    --queue-bg: #ccfbf1;
    --var: #7c3aed;
    --var-bg: #ede9fe;
    --cell: #ffffff;
    --grey: #d4d4d8;
    --grey-ink: #52525b;
    --ret: #fde047;
    --ret-ink: #422006;
    --hl: #f59e0b;
    --hl-bg: #fef3c7;
    --cur-bg: #dbeafe;
    --err: #dc2626;
    --err-bg: #fee2e2;
    --ok: #15803d;
    --ok-bg: #dcfce7;
    --shadow: 0 1px 3px rgba(15, 23, 42, .08), 0 1px 2px rgba(15, 23, 42, .04);
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
    --dur: 600ms;
    --cw: 2.9rem;
  }
  [data-theme="dark"] {
    --bg: #0b1220;
    --panel: #172033;
    --ink: #e2e8f0;
    --muted: #94a3b8;
    --border: #2c3a52;
    --line: #94a3b8;
    --accent: #60a5fa;
    --accent-ink: #0b1220;
    --stack: #60a5fa;
    --stack-bg: #1e3a5f;
    --queue: #2dd4bf;
    --queue-bg: #134e4a;
    --var: #c4b5fd;
    --var-bg: #3b2a63;
    --cell: #0f172a;
    --grey: #3f3f46;
    --grey-ink: #a1a1aa;
    --ret: #facc15;
    --ret-ink: #1c1203;
    --hl: #fbbf24;
    --hl-bg: #4a3510;
    --cur-bg: #1e3a5f;
    --err: #f87171;
    --err-bg: #4c1d1d;
    --ok: #4ade80;
    --ok-bg: #14361f;
    --shadow: 0 1px 3px rgba(0, 0, 0, .4);
  }

  * { box-sizing: border-box; }
  html { font-size: 16px; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.4;
    -webkit-tap-highlight-color: transparent;
  }
  button {
    font: inherit;
    color: inherit;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:disabled { cursor: not-allowed; opacity: .45; }
  code, .mono { font-family: var(--mono); }

  /* ---------- header ---------- */
  header.top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .6rem 1.2rem;
    padding: .6rem 1.2rem;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  header h1 { margin: 0; font-size: 1.25rem; }
  header h1 span { white-space: nowrap; }
  header h1 .zh { font-weight: 600; color: var(--muted); }
  .tabs { display: flex; gap: .3rem; }
  .tabs button {
    min-height: 2.75rem;
    padding: .4rem 1.1rem;
    border: 1px solid var(--border);
    border-radius: .6rem;
    background: transparent;
    font-weight: 600;
  }
  .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin-left: auto; }
  .tbtn {
    min-height: 2.75rem;
    min-width: 2.75rem;
    padding: .3rem .7rem;
    border: 1px solid var(--border);
    border-radius: .6rem;
    background: var(--panel);
  }
  .tbtn:hover:not(:disabled) { border-color: var(--accent); }
  .zoomval { min-width: 3.2rem; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }
  .sep { width: 1px; height: 1.8rem; background: var(--border); margin: 0 .2rem; }

  /* ---------- layout ---------- */
  main.layout {
    display: grid;
    /* program pane only as wide as it needs; the structures get the rest (8 queue cells need ≈ 34rem) */
    grid-template-columns: minmax(0, 1fr) clamp(21rem, calc(100vw - 36rem), 27rem);
    gap: 1rem;
    padding: 1rem;
    align-items: start;
  }
  @media (max-width: 960px) { main.layout { grid-template-columns: 1fr; } }
  .pane {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: .9rem;
    box-shadow: var(--shadow);
    padding: 1rem;
    min-width: 0;
  }

  /* segmented control */
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: .6rem; overflow: hidden; }
  .seg button {
    min-height: 2.75rem;
    padding: .3rem 1rem;
    border: 0;
    background: transparent;
    font-weight: 600;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

  /* ---------- left: structures ---------- */
  .ltool { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; margin-bottom: 1rem; }
  .badge {
    font-family: var(--mono);
    padding: .3rem .7rem;
    border: 1px solid var(--border);
    border-radius: .5rem;
    background: var(--bg);
  }
  .structs { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-start; }
  .structs.array { flex-direction: column; align-items: stretch; }
  .card {
    border: 2px solid var(--border);
    border-radius: .8rem;
    padding: .7rem .9rem .9rem;
    min-width: 0;
    max-width: 100%;
  }
  .card.stack { border-color: color-mix(in srgb, var(--stack) 45%, var(--border)); }
  .card.queue { border-color: color-mix(in srgb, var(--queue) 45%, var(--border)); }
  .chead { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .6rem; margin-bottom: .7rem; }
  .sname { font-family: var(--mono); font-size: 1.5rem; font-weight: 700; }
  .stack .sname { color: var(--stack); }
  .queue .sname { color: var(--queue); }
  .stype { color: var(--muted); font-size: .9rem; }
  .stats { display: flex; gap: .3rem; margin-left: auto; }
  .stat {
    min-height: 2.4rem;
    padding: .2rem .55rem;
    border: 1px solid var(--border);
    border-radius: .5rem;
    background: var(--bg);
    font-family: var(--mono);
    font-size: .85rem;
  }
  .stat b { margin-left: .3rem; }
  .stat .t { color: var(--ok); }
  .stat .f { color: var(--muted); }
  .vv.alert { border-color: var(--err); background: var(--err-bg); animation: pulse 1s ease-in-out 3; }
  .stat.alert { border-color: var(--err); background: var(--err-bg); animation: pulse 1s ease-in-out 3; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 .35rem color-mix(in srgb, var(--err) 35%, transparent); } }
  .statx {
    font-family: var(--mono);
    font-size: .9rem;
    background: var(--bg);
    border-radius: .5rem;
    padding: .45rem .7rem;
    margin: -.3rem 0 .7rem;
    white-space: pre;
    overflow-x: auto;
  }
  .statx .dim { color: var(--muted); }

  /* graphical stack */
  .gstackwrap { display: flex; align-items: flex-end; gap: .4rem; }
  .gstack {
    display: flex;
    flex-direction: column-reverse;
    border: 2px solid var(--line);
    border-top: 0;
    padding: .25rem;
    gap: .2rem;
    width: 4.2rem;
  }
  .gslot { height: 2.4rem; display: grid; place-items: stretch; border: 1px dashed color-mix(in srgb, var(--border) 70%, transparent); border-radius: .3rem; }
  .gptrs { display: flex; flex-direction: column-reverse; padding: .25rem 0; gap: .2rem; }
  .gptr { height: 2.4rem; display: flex; align-items: center; font-size: .85rem; color: var(--stack); font-weight: 600; white-space: nowrap; }
  .tok {
    display: grid;
    place-items: center;
    border-radius: .3rem;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 1.1rem;
    background: var(--stack-bg);
    border: 2px solid var(--stack);
  }
  .queue .tok { background: var(--queue-bg); border-color: var(--queue); }
  /* graphical queue */
  .gqueue { display: flex; align-items: center; gap: .5rem; }
  .gqrow { display: flex; gap: .2rem; padding: .25rem; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); }
  .gqrow .gslot { width: 2.9rem; }
  .gqend { font-size: .8rem; color: var(--muted); text-align: center; line-height: 1.1; }
  .gqlabels { display: flex; gap: .2rem; padding: 0 .25rem; margin-left: 2.6rem; }
  .gqlabels span { width: 2.9rem; text-align: center; font-size: .8rem; font-weight: 600; color: var(--queue); line-height: 1.1; }

  /* array view */
  .ascroll { overflow-x: auto; padding-bottom: 1rem; }
  .agrid { display: grid; grid-template-columns: 2.8rem repeat(var(--n), var(--cw)); }
  .agrid .c {
    height: 2.4rem;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    margin: -1px 0 0 -1px;
    font-family: var(--mono);
    font-weight: 600;
  }
  .agrid .lab { font-family: var(--mono); color: var(--muted); display: grid; place-items: center end; padding-right: .4rem; height: 2.4rem; }
  .agrid .ix { color: var(--muted); font-weight: 400; background: var(--bg); }
  .agrid .live { background: var(--cell); font-size: 1.1rem; }
  .agrid .stale { background: var(--grey); color: var(--grey-ink); }
  .agrid .unused { background: var(--grey); color: var(--grey-ink); font-weight: 400; }
  .agrid .mk { min-height: 1.5rem; display: flex; flex-direction: column; align-items: center; font-size: .75rem; font-family: var(--mono); font-weight: 700; line-height: 1; gap: 1px; flex-wrap: wrap; }
  .mk span { padding: .1rem .2rem; border-radius: .25rem; }
  .mk .m-top, .mk .m-head { background: var(--stack-bg); color: var(--stack); }
  .queue .mk .m-head { background: var(--queue-bg); color: var(--queue); }
  .mk .m-tail { background: var(--hl-bg); color: color-mix(in srgb, var(--hl) 70%, var(--ink)); }
  .agrid .sp { height: .5rem; position: relative; }
  .agrid .sp.on::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: .35rem; background: var(--queue); }
  .stack .agrid .sp.on::after { background: var(--stack); }
  .agrid .sp .splab { position: absolute; top: .45rem; left: 0; font-size: .72rem; font-family: var(--mono); white-space: nowrap; color: var(--muted); }
  .agrid .wraprow { grid-column: 2 / -1; position: relative; height: 1.9rem; }
  .wrapline {
    position: absolute;
    left: calc(var(--cw) / 2);
    right: calc(var(--cw) / 2);
    top: .9rem;
    height: .7rem;
    border: 2px dashed var(--queue);
    border-top: 0;
    border-radius: 0 0 .6rem .6rem;
  }
  .wrapline::before {
    content: "";
    position: absolute;
    left: -.45rem;
    top: -.55rem;
    border: .4rem solid transparent;
    border-bottom: .55rem solid var(--queue);
    border-top: 0;
  }
  .wrapline span {
    position: absolute;
    left: 50%;
    bottom: -.6rem;
    transform: translateX(-50%);
    background: var(--panel);
    padding: 0 .4rem;
    font-size: .75rem;
    color: var(--queue);
    white-space: nowrap;
  }
  .avars { display: flex; flex-wrap: wrap; gap: .5rem 1rem; margin-top: .9rem; align-items: center; }
  .vbox { display: inline-flex; align-items: center; gap: .35rem; font-family: var(--mono); }
  .vbox .vn { color: var(--muted); }
  .vv {
    min-width: 2.4rem;
    height: 2.2rem;
    padding: 0 .4rem;
    display: inline-grid;
    place-items: center;
    border: 2px solid var(--line);
    background: var(--cell);
    font-family: var(--mono);
    font-weight: 700;
    font-size: 1.05rem;
    border-radius: .2rem;
  }
  .vv.dashed { border-style: dashed; color: var(--muted); }
  .vv.unset { color: var(--muted); font-weight: 400; border-style: dotted; }
  .vv.ret { background: var(--ret); color: var(--ret-ink); border-color: color-mix(in srgb, var(--ret) 50%, #000); }

  .varpanel {
    margin-top: 1rem;
    padding-top: .9rem;
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: .6rem 1.4rem;
    align-items: center;
  }
  .varpanel .grp { display: flex; flex-wrap: wrap; gap: .5rem .8rem; align-items: center; }
  .varpanel .lbl { font-weight: 600; color: var(--muted); font-size: .9rem; }
  .retgrp { background: var(--ret); color: var(--ret-ink); border-radius: .5rem; padding: .25rem .6rem; }
  .retgrp .vn { color: var(--ret-ink); }
  .locals { border: 1px dashed var(--border); border-radius: .5rem; padding: .25rem .6rem; }

  /* ---------- right: program ---------- */
  .setup {
    display: grid;
    gap: .6rem;
    padding-bottom: 1rem;
    margin-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .setup .row { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
  .setup .rl { min-width: 7.5rem; font-weight: 600; font-size: .95rem; }
  .stepper { display: inline-flex; align-items: center; gap: .3rem; }
  .stepper output { min-width: 2rem; text-align: center; font-family: var(--mono); font-weight: 700; font-size: 1.1rem; }
  .schip {
    display: inline-flex;
    align-items: center;
    gap: .2rem;
    border: 2px solid var(--border);
    border-radius: 2rem;
    padding: 0 0 0 .8rem;
    font-family: var(--mono);
    font-weight: 700;
    min-height: 2.75rem;
  }
  .schip.stack { border-color: var(--stack); color: var(--stack); }
  .schip.queue { border-color: var(--queue); color: var(--queue); }
  .schip small { font-family: system-ui, sans-serif; font-weight: 400; color: var(--muted); margin-left: .2rem; }
  .schip button { border: 0; background: transparent; min-width: 2.6rem; min-height: 2.6rem; border-radius: 2rem; color: var(--muted); }
  .schip button:hover:not(:disabled) { color: var(--err); }
  .lockmsg { font-size: .85rem; color: var(--muted); }

  .phead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: .5rem; }
  .phead h2 { margin: 0; font-size: 1.1rem; }
  .phead span { color: var(--muted); font-size: .9rem; }
  ol.lines { list-style: none; margin: 0; padding: 0; display: grid; gap: .35rem; }
  .line {
    border: 1px solid var(--border);
    border-radius: .6rem;
    background: var(--panel);
  }
  .lmain { display: flex; align-items: center; gap: .15rem; padding: .25rem .2rem; min-height: 3.2rem; }
  .line.cur { border-color: var(--accent); background: var(--cur-bg); box-shadow: 0 0 0 1px var(--accent); }
  .line.just { border-color: var(--hl); background: var(--hl-bg); box-shadow: 0 0 0 1px var(--hl); }
  .line.done .lmain { opacity: .6; }
  .line.just .lptr, .line.done .lptr { color: color-mix(in srgb, var(--hl) 75%, var(--ink)); }
  .line.done .lptr { color: var(--muted); }
  .legend { display: flex; gap: .8rem; font-size: .85rem; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: .3rem; }
  .legend i { font-style: normal; font-weight: 700; padding: 0 .35rem; border-radius: .3rem; border: 1px solid; }
  .legend .lg-next { color: var(--accent); background: var(--cur-bg); border-color: var(--accent); }
  .legend .lg-just { color: color-mix(in srgb, var(--hl) 75%, var(--ink)); background: var(--hl-bg); border-color: var(--hl); }
  .status .srow { display: flex; gap: .45rem; align-items: baseline; }
  .status .srow + .srow { margin-top: .25rem; }
  .status .sm { font-weight: 700; flex: none; width: 1rem; text-align: center; }
  .status .sm.j { color: color-mix(in srgb, var(--hl) 75%, var(--ink)); }
  .status .sm.n { color: var(--accent); }
  .status code { font-weight: 600; }
  .line.err { border-color: var(--err); background: var(--err-bg); box-shadow: 0 0 0 1px var(--err); }
  .ln { width: 1.3rem; text-align: right; color: var(--muted); font-family: var(--mono); font-size: .9rem; flex: none; }
  .lptr { width: 1.1rem; color: var(--accent); font-weight: 700; flex: none; text-align: center; }
  .line.err .lptr { color: var(--err); }
  .expbtn { border: 0; background: transparent; min-width: 2.2rem; min-height: 2.6rem; border-radius: .5rem; color: var(--muted); font-size: .9rem; flex: none; }
  .expbtn[aria-expanded="true"] { color: var(--accent); background: var(--bg); }
  .code { display: flex; flex-wrap: wrap; align-items: center; font-family: var(--mono); font-size: 1.1rem; flex: 1; min-width: 0; }
  .pun { white-space: pre; }
  .chip {
    font-family: var(--mono);
    font-size: 1.1rem;
    font-weight: 700;
    min-height: 2.6rem;
    min-width: 2.4rem;
    padding: 0 .45rem;
    border: 1px solid transparent;
    border-radius: .4rem;
    background: transparent;
  }
  button.chip { border-color: var(--border); background: var(--bg); border-bottom-width: 2px; }
  button.chip:hover { border-color: var(--accent); }
  span.chip { display: inline-grid; place-items: center; padding: 0 .1rem; min-width: 0; }
  .chip.k-stack { color: var(--stack); }
  .chip.k-queue { color: var(--queue); }
  .chip.var { color: var(--var); }
  .res { font-family: var(--mono); font-size: .9rem; color: var(--muted); white-space: nowrap; }
  .delbtn { border: 0; background: transparent; min-width: 2.4rem; min-height: 2.6rem; border-radius: .5rem; color: var(--muted); flex: none; }
  .delbtn:hover { color: var(--err); }
  .listing { border-top: 1px dashed var(--border); padding: .35rem .5rem .5rem 1rem; display: grid; gap: .1rem; }
  .lrow { display: flex; align-items: baseline; flex-wrap: wrap; gap: .1rem .8rem; padding: .2rem .4rem; border-radius: .35rem; position: relative; }
  .lrow code { white-space: pre; font-size: 1rem; }
  .lrow.fn code { color: var(--muted); font-weight: 700; }
  .lrow .bind { font-family: var(--mono); font-size: .85rem; color: var(--var); }
  .lrow .note { font-family: var(--mono); font-size: .85rem; color: var(--muted); }
  .lrow.done-row code { color: var(--muted); }
  .lrow.just { background: var(--hl-bg); box-shadow: inset 3px 0 0 var(--hl); }
  .lrow.just .note { color: var(--ink); font-weight: 600; }
  .lrow.next::before { content: "▶"; position: absolute; left: -1rem; color: var(--accent); font-size: .8rem; top: .3rem; }
  .lrow.errrow { background: var(--err-bg); box-shadow: inset 3px 0 0 var(--err); }
  .addline {
    width: 100%;
    margin-top: .5rem;
    min-height: 2.9rem;
    border: 2px dashed var(--border);
    border-radius: .6rem;
    background: transparent;
    color: var(--muted);
    font-weight: 600;
  }
  .addline:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .controls { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: .5rem; margin-top: 1rem; }
  .cbtn {
    min-height: 3.2rem;
    border: 1px solid var(--border);
    border-radius: .7rem;
    background: var(--panel);
    font-weight: 700;
    font-size: 1rem;
    white-space: nowrap;
    padding: 0 .3rem;
  }
  .cbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 1.15rem; }
  .status {
    margin-top: .8rem;
    padding: .6rem .8rem;
    border-radius: .6rem;
    background: var(--bg);
    font-size: .95rem;
    min-height: 2.8rem;
  }
  .status.ok { background: var(--ok-bg); }
  .status.err { background: var(--err-bg); border: 1px solid var(--err); }
  .status .rt { font-family: var(--mono); font-weight: 700; color: var(--err); }
  .status .hint { display: block; margin-top: .3rem; }
  .crow2 { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .8rem; margin-top: .5rem; }
  .keys { font-size: .8rem; color: var(--muted); }
  .rfoot { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1rem; padding-top: .8rem; border-top: 1px solid var(--border); }
  kbd { font-family: var(--mono); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: .25rem; padding: 0 .3rem; }

  /* ---------- menu & dialog ---------- */
  .menu {
    position: absolute;
    z-index: 40;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: .7rem;
    box-shadow: 0 10px 30px rgba(15, 23, 42, .25);
    padding: .5rem;
    max-width: min(26rem, calc(100vw - 1rem));
  }
  .menu[hidden] { display: none; }
  .menu .mh { font-size: .8rem; font-weight: 700; color: var(--muted); margin: .4rem .3rem .3rem; text-transform: uppercase; letter-spacing: .03em; }
  .menu .mgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: .3rem; }
  .menu .mlist { display: flex; flex-wrap: wrap; gap: .3rem; }
  .menu button {
    min-height: 2.75rem;
    min-width: 2.75rem;
    padding: .2rem .7rem;

const clone = o => JSON.parse(JSON.stringify(o));
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function t(key, p = {}) {
  const s = (I18N[app.settings.lang] || I18N.en)[key] ?? I18N.en[key] ?? key;
  return s.replace(/\{(\w+)\}/g, (_, k) => (p[k] ?? `{${k}}`));
}

/* ======================================================================
   Demo model
   demo = { tab, max, impl, names:{stack,queue}, structs:[{name,type,init:{arr,size,head}}], program:[line] }
   line = { op, t, arg?:{k:'num',v}|{k:'var',n}|{k:'call',op,t}, dest? }
   ====================================================================== */
function kindsAllowed(tab) {
  return tab === 'stack' ? ['stack'] : tab === 'queue' ? ['queue'] : ['stack', 'queue'];
}
function structOf(d, name) { return d.structs.find(s => s.name === name); }

function progLiterals(d, exceptIdx = -1) {
  const out = [];
  d.program.forEach((ln, i) => { if (i !== exceptIdx && ln.arg && ln.arg.k === 'num') out.push(ln.arg.v); });
  return out;
}
function initValues(d) {
  const out = [];
  d.structs.forEach(s => {
    const st = s.init;
    for (let j = 0; j < st.size; j++) out.push(st.arr[(st.head + j) % d.max]);
  });
  return out;
}
function usedValues(d, exceptIdx = -1) {
  return new Set([...initValues(d), ...progLiterals(d, exceptIdx)]);
}
function freeValues(d, exceptIdx = -1) {
  const used = usedValues(d, exceptIdx);
  return range(VMIN, VMAX).filter(v => !used.has(v));
}

function fillContents(d, only) {
  const targets = only || d.structs;
  const used = new Set(progLiterals(d));
  d.structs.forEach(s => { if (!targets.includes(s) && s.init) initValuesOf(s, d).forEach(v => used.add(v)); });
  const cap = Math.min(d.max - 2, [0, 5, 4, 3][d.structs.length]);
  for (const s of targets) {
    const M = d.max;
    const arr = Array(M).fill(null);
    const free = shuffle(range(VMIN, VMAX).filter(v => !used.has(v)));
    let n = Math.random() < 0.2 ? 0 : randInt(1, cap);
    n = Math.max(0, Math.min(n, free.length - 6));
    const head = s.type === 'queue' && d.impl === 'circular' ? randInt(0, M - 1) : 0;
    for (let j = 0; j < n; j++) { const v = free[j]; arr[(head + j) % M] = v; used.add(v); }
    s.init = { arr, size: n, head };
  }
}
function initValuesOf(s, d) {
  const out = [];
  for (let j = 0; j < s.init.size; j++) out.push(s.init.arr[(s.init.head + j) % d.max]);
  return out;
}

function newDemo(tab, base) {
  const sets = shuffle(NAME_SETS);
  const names = { stack: sets[0], queue: tab === 'mixed' ? sets[1] : sets[0] };
  const kinds = base ? base.structs.map(s => s.type) : tab === 'mixed' ? ['stack', 'queue'] : [tab];
  const d = { tab, max: base ? base.max : CAP_DEF, impl: base ? base.impl : 'circular', names, structs: [], program: [] };
  const count = { stack: 0, queue: 0 };
  for (const k of kinds) d.structs.push({ name: names[k][count[k]++], type: k });
  fillContents(d);
  return d;
}

function nextName(d, kind) {
  const set = d.names[kind];
  return [...set].find(c => !d.structs.some(s => s.name === c));
}

/* ======================================================================
   Engine — array implementation, index from 0
   State S = { st:{X:{arr,size,head}}, vars:{m,n,k,d}, ret, temp, i }
   ====================================================================== */
function initState(d) {
  const st = {};
  d.structs.forEach(s => { st[s.name] = clone(s.init); });
  return { st, vars: { m: null, n: null, k: null, d: null }, ret: null, temp: null, i: null };
}

// Pseudocode of each function body (one entry per Run step row)
function body(op, X, impl) {
  const s = 'size' + X, h = 'head' + X;
  switch (op) {
    case 'push': return [`${X}[${s}] ← v`, `${s} ← ${s} + 1`];
    case 'pop': return [`${s} ← ${s} − 1`, `return ${X}[${s}]`];
    case 'enqueue': return impl === 'circular'
      ? [`${X}[(${h} + ${s}) mod MAX] ← v`, `${s} ← ${s} + 1`]
      : [`${X}[${s}] ← v`, `${s} ← ${s} + 1`];
    case 'dequeue': return impl === 'circular'
      ? [`temp ← ${X}[${h}]`, `${h} ← (${h} + 1) mod MAX`, `${s} ← ${s} − 1`, `return temp`]
      : [`temp ← ${X}[0]`, `for i ← 0 to ${s} − 2`, `    ${X}[i] ← ${X}[i + 1]`, `${s} ← ${s} − 1`, `return temp`];
  }
  return [];
}

function argText(arg) {
  if (!arg) return '?';
  if (arg.k === 'num') return String(arg.v);
  if (arg.k === 'var') return arg.n;
  return `${OPNAME[arg.op]}(${arg.t})`;
}
function lineText(ln) {
  return RETOP[ln.op] ? `${ln.dest} ← ${OPNAME[ln.op]}(${ln.t})` : `${OPNAME[ln.op]}(${ln.t}, ${argText(ln.arg)})`;
}

// Rows of the expanded view of a program line. Indices match `li` in emitted steps.
function listing(ln, d) {
  const rows = [];
  const fnRows = (op, X, extra) => {
    rows.push({ t: RETOP[op] ? `${OPNAME[op]}(${X}):` : `${OPNAME[op]}(${X}, v):`, cls: 'fn', ...extra });
    body(op, X, d.impl).forEach(t => rows.push({ t: '    ' + t, cls: 'code' }));
  };
  if (RETOP[ln.op]) {
    fnRows(ln.op, ln.t);
    rows.push({ t: `${ln.dest} ← ${OPNAME[ln.op]}(${ln.t})`, cls: 'code' });
  } else {
    if (ln.arg.k === 'call') fnRows(ln.arg.op, ln.arg.t);
    fnRows(ln.op, ln.t, { bind: ln.arg.k === 'call' ? { ret: argText(ln.arg) } : { txt: argText(ln.arg) } });
  }
  return rows;
}

function rtErr(li, key, params, alert) { return { rt: true, li, key, params, alert }; }

function execRemove(op, X, d, S, li, emit) {
  const st = S.st[X], M = d.max, s = 'size' + X, h = 'head' + X;
  if (st.size === 0) throw rtErr(li, 'errEmpty', { X, s, op: OPNAME[op] }, 'isempty:' + X);
  if (op === 'pop') {
    st.size--;
    emit(li, `${s} ← ${st.size + 1} − 1 = ${st.size}`);
    const v = st.arr[st.size];
    S.ret = v;
    emit(li + 1, `return ${X}[${st.size}] → ${v}`, [[`cell:${X}:${st.size}`, 'ret']]);
    return v;
  }
  if (d.impl === 'circular') {
    const v = st.arr[st.head];
    S.temp = v;
    emit(li, `temp ← ${X}[${st.head}] = ${v}`, [[`cell:${X}:${st.head}`, 'temp']]);
    const oh = st.head;
    st.head = (st.head + 1) % M;
    emit(li + 1, `${h} ← (${oh} + 1) mod ${M} = ${st.head}`);
    st.size--;
    emit(li + 2, `${s} ← ${st.size + 1} − 1 = ${st.size}`);
    S.ret = v; S.temp = null;
    emit(li + 3, `return temp → ${v}`, [['temp', 'ret']]);
    return v;
  }
  // linear queue: front is always index 0, shift everything left
  const v = st.arr[0];
  S.temp = v;
  emit(li, `temp ← ${X}[0] = ${v}`, [[`cell:${X}:0`, 'temp']]);
  if (st.size - 2 < 0) {
    emit(li + 1, `for i ← 0 to ${st.size} − 2 = −1  →  0 passes`);
  } else {
    for (let i = 0; i <= st.size - 2; i++) {
      S.i = i;
      st.arr[i] = st.arr[i + 1];
      emit(li + 2, `${X}[${i}] ← ${X}[${i + 1}] = ${st.arr[i]}`, [[`cell:${X}:${i + 1}`, `cell:${X}:${i}`]],
        { li2: li + 1, note2: `i = ${i}  (0 to ${st.size - 2})` });
    }
  }
  S.i = null;
  st.size--;
  emit(li + 3, `${s} ← ${st.size + 1} − 1 = ${st.size}`);
  S.ret = v; S.temp = null;
  emit(li + 4, `return temp → ${v}`, [['temp', 'ret']]);
  return v;
}

function execInsert(op, X, v, src, d, S, li, emit) {
  const st = S.st[X], M = d.max, s = 'size' + X;
  if (st.size === M) throw rtErr(li, 'errFull', { X, s, op: OPNAME[op], max: M }, 'isfull:' + X);
  let idx, note;
  if (op === 'enqueue' && d.impl === 'circular') {
    idx = (st.head + st.size) % M;
    note = `${X}[(${st.head} + ${st.size}) mod ${M}] = ${X}[${idx}] ← ${v}`;
  } else {
    idx = st.size;
    note = `${X}[${idx}] ← ${v}`;
  }
  st.arr[idx] = v;
  emit(li, note, src ? [[src, `cell:${X}:${idx}`]] : [], { extra: [li - 1, `v = ${v}`], write: `${X}[${idx}] ← ${v}` });
  st.size++;
  emit(li + 1, `${s} ← ${st.size - 1} + 1 = ${st.size}`);
}

function execLine(ln, d, S, emit) {
  S.ret = null; S.temp = null; S.i = null;
  if (RETOP[ln.op]) {
    const v = execRemove(ln.op, ln.t, d, S, 1, emit);
    S.vars[ln.dest] = v;
    emit(1 + body(ln.op, ln.t, d.impl).length, `${ln.dest} ← ${v}`, [['ret', 'var:' + ln.dest]]);
    return;
  }
  let v, src = null, base = 0;
  if (ln.arg.k === 'call') {
    v = execRemove(ln.arg.op, ln.arg.t, d, S, 1, emit);
    src = 'ret';
    base = 1 + body(ln.arg.op, ln.arg.t, d.impl).length;
  } else if (ln.arg.k === 'var') {
    v = S.vars[ln.arg.n];
    if (v == null) throw rtErr(0, 'errVar', { v: ln.arg.n }, 'var:' + ln.arg.n);
    src = 'var:' + ln.arg.n;
  } else {
    v = ln.arg.v;
  }
  execInsert(ln.op, ln.t, v, src, d, S, base + 1, emit);
}

// Precompute every micro-step of the whole program (program is locked while running).
function buildTrace(d) {
  const S = initState(d);
  const init = clone(S);
  const lines = [];
  let err = null;
  for (let L = 0; L < d.program.length; L++) {
    const steps = [];
    const emit = (li, note, flies = [], o = {}) => steps.push({ S: clone(S), li, note, flies, ...o });
    try {
      execLine(d.program[L], d, S, emit);
    } catch (e) {
      if (!e.rt) throw e;
      steps.push({ S: clone(S), li: e.li, flies: [], error: e });
      lines.push({ steps });
      err = L;
      break;
    }
    lines.push({ steps });
  }
  return { init, lines, err };
}

/* ---------- random program (always valid: no runtime error) ---------- */
function randomLine(d, S, used) {
  const s = pick(d.structs);
  const st = S.st[s.name];
  if (st.size > 0 && Math.random() < 0.45) {
    const unset = VARS.filter(v => S.vars[v] == null);
    const dest = unset.length && Math.random() < 0.7 ? pick(unset) : pick(VARS);
    return { op: REMOVE_OF[s.type], t: s.name, dest };
  }
  const r = Math.random();
  const assigned = VARS.filter(v => S.vars[v] != null);
  const sources = d.structs.filter(o => o !== s && S.st[o.name].size > 0);
  let arg;
  if (r < 0.2 && assigned.length) arg = { k: 'var', n: pick(assigned) };
  else if (r < 0.45 && sources.length) { const o = pick(sources); arg = { k: 'call', op: REMOVE_OF[o.type], t: o.name }; }
  else {
    const free = range(VMIN, VMAX).filter(v => !used.has(v));
    if (!free.length) return null;
    arg = { k: 'num', v: pick(free) };
  }
  return { op: INSERT_OF[s.type], t: s.name, arg };
}
function randomProgram(d) {
  const target = randInt(5, 8);
  let best = [];
  for (let attempt = 0; attempt < 30 && best.length < target; attempt++) {
    let S = initState(d);
    const used = new Set(initValues(d));
    const prog = [];
    for (let k = 0; k < target; k++) {
      let placed = false;
      for (let tries = 0; tries < 40 && !placed; tries++) {
        const ln = randomLine(d, S, used);
        if (!ln) continue;
        const S2 = clone(S);
        try { execLine(ln, d, S2, () => {}); } catch (e) { if (e.rt) continue; throw e; }
        S = S2;
        prog.push(ln);
        if (ln.arg && ln.arg.k === 'num') used.add(ln.arg.v);
        placed = true;
      }
      if (!placed) break;
    }
    if (prog.length > best.length) best = prog;
  }
  return best;
}

/* ======================================================================
   App state & persistence
   ====================================================================== */
const app = {
  tab: 'stack',
  tabs: {},          // tab -> { demo, run, exp }
  settings: { lang: 'en', theme: 'light', zoom: 1, speed: 'normal', view: 'graphical' },
  saves: [],         // [{ when, demo }]
  open: {},          // expanded IsEmpty/IsFull explanations
  notice: null,      // one-off status message
};
const T = () => app.tabs[app.tab];

function persist() {
  try {
    const demos = {};
    TABS.forEach(k => { demos[k] = app.tabs[k].demo; });
    localStorage.setItem(STORE_KEY, JSON.stringify({ settings: app.settings, tab: app.tab, demos, saves: app.saves }));
  } catch (e) { /* storage unavailable (private mode): run without saving */ }
}

function validDemo(d) {
  try {
    if (!d || !TABS.includes(d.tab)) return false;
    if (!Number.isInteger(d.max) || d.max < CAP_MIN || d.max > CAP_MAX) return false;
    if (!['circular', 'linear'].includes(d.impl)) return false;
    if (!d.names || !NAME_SETS.includes(d.names.stack) || !NAME_SETS.includes(d.names.queue)) return false;
    if (!Array.isArray(d.structs) || d.structs.length < 1 || d.structs.length > MAXSTRUCTS) return false;
    const allowed = kindsAllowed(d.tab);
    for (const s of d.structs) {
      if (!allowed.includes(s.type) || !d.names[s.type].includes(s.name)) return false;
      const st = s.init;
      if (!st || !Array.isArray(st.arr) || st.arr.length !== d.max) return false;
      if (!Number.isInteger(st.size) || st.size < 0 || st.size > d.max) return false;
      if (!Number.isInteger(st.head) || st.head < 0 || st.head >= d.max) return false;
      if (!st.arr.every(v => v === null || (Number.isInteger(v) && v >= VMIN && v <= VMAX))) return false;
      for (let j = 0; j < st.size; j++) if (st.arr[(st.head + j) % d.max] === null) return false;
    }
    if (new Set(d.structs.map(s => s.name)).size !== d.structs.length) return false;
    if (!Array.isArray(d.program) || d.program.length > MAXLINES) return false;
    for (const ln of d.program) {
      const s = structOf(d, ln.t);
      if (!OPNAME[ln.op] || !s || KIND[ln.op] !== s.type) return false;
      if (RETOP[ln.op]) { if (!VARS.includes(ln.dest)) return false; continue; }
      const a = ln.arg;
      if (!a) return false;
      if (a.k === 'num') { if (!Number.isInteger(a.v) || a.v < VMIN || a.v > VMAX) return false; }
      else if (a.k === 'var') { if (!VARS.includes(a.n)) return false; }
      else if (a.k === 'call') { const o = structOf(d, a.t); if (!RETOP[a.op] || !o || KIND[a.op] !== o.type) return false; }
      else return false;
    }
    return true;
  } catch (e) { return false; }
}

function restore() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { saved = null; }
  if (saved && saved.settings) {
    const s = saved.settings;
    if (I18N[s.lang]) app.settings.lang = s.lang;
    if (['light', 'dark'].includes(s.theme)) app.settings.theme = s.theme;
    if (typeof s.zoom === 'number' && s.zoom >= 0.7 && s.zoom <= 1.8) app.settings.zoom = s.zoom;
    if (SPEEDS[s.speed]) app.settings.speed = s.speed;
    if (['graphical', 'array'].includes(s.view)) app.settings.view = s.view;
  }
  if (saved && TABS.includes(saved.tab)) app.tab = saved.tab;
  if (saved && Array.isArray(saved.saves)) app.saves = saved.saves.filter(x => x && validDemo(x.demo)).slice(0, MAXSAVES);
  TABS.forEach(k => {
    const d = saved && saved.demos && saved.demos[k];
    app.tabs[k] = { demo: validDemo(d) && d.tab === k ? d : newDemo(k), run: null, exp: -1 };
  });
  // shared link
  const m = location.hash.match(/^#demo=([A-Za-z0-9_-]+)$/);
  if (m) {
    const d = decodeDemo(m[1]);
    if (d) {
      app.tab = d.tab;
      app.tabs[d.tab] = { demo: d, run: null, exp: -1 };
      app.notice = { key: 'sharedLoaded' };
    } else app.notice = { key: 'sharedBad', bad: true };
    history.replaceState(null, '', location.pathname + location.search);
  }
}

function encodeDemo(d) {
  const json = JSON.stringify(d);
  return btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decodeDemo(code) {
  try {
    const b64 = code.replace(/-/g, '+').replace(/_/g, '/');
    const d = JSON.parse(decodeURIComponent(escape(atob(b64))));
    return validDemo(d) ? d : null;
  } catch (e) { return null; }
}

/* ======================================================================
   Run state
   run = { trace, line, sub, hist:[{line,sub}] }
   (line, sub): next line to run, and how many of its steps are done
   ====================================================================== */
function stepsOf(R, L) { return (R.trace.lines[L] || { steps: [] }).steps; }
function runError(R) {
  if (!R || R.trace.err == null || R.line !== R.trace.err) return null;
  const st = stepsOf(R, R.line);
  return R.sub === st.length ? st[st.length - 1].error : null;
}
function runFinished(R, d) { return R && R.line >= d.program.length; }
function runDone(R, d) { return !!R && (runFinished(R, d) || !!runError(R)); }
function lastExec(R) {
  if (!R) return null;
  if (R.sub > 0) return { line: R.line, k: R.sub - 1 };
  if (R.line > 0) return { line: R.line - 1, k: stepsOf(R, R.line - 1).length - 1 };
  return null;
}
function displayState(tb) {
  const R = tb.run;
  if (!R) return initState(tb.demo);
  const le = lastExec(R);
  return le ? stepsOf(R, le.line)[le.k].S : R.trace.init;
}

/* ---------- left pane ---------- */
function renderLeft() {

function statusBoxes(X, st, M, err) {
  const b = v => `<b class="${v ? 't' : 'f'}">${v}</b>`;
  const cls = ref => (err && err.alert === ref ? ' alert' : '');
  return `<div class="stats">
    <button class="stat${cls('isempty:' + X)}" data-act="stat" data-key="empty:${X}" data-ref="isempty:${X}">IsEmpty(${X})${b(st.size === 0)}</button>
    <button class="stat${cls('isfull:' + X)}" data-act="stat" data-key="full:${X}" data-ref="isfull:${X}">IsFull(${X})${b(st.size === M)}</button>
  </div>`;
}
function statusExplain(X, st, M) {
  const out = [];
  if (app.open['empty:' + X]) out.push(`IsEmpty(${X}):\n    return size${X} = 0      <span class="dim">→ ${st.size} = 0 → ${st.size === 0}</span>`);
  if (app.open['full:' + X]) out.push(`IsFull(${X}):\n    return size${X} = MAX    <span class="dim">→ ${st.size} = ${M} → ${st.size === M}</span>`);
  return out.length ? `<div class="statx">${out.join('\n')}</div>` : '';
}

function liveIndex(s, st, d, i) {
  if (s.type === 'queue' && d.impl === 'circular') return mod(i - st.head, d.max) < st.size;
  return i < st.size;
}
// logical order of live items -> array indices
function liveOrder(s, st, d) {
  const out = [];
  for (let j = 0; j < st.size; j++) out.push(s.type === 'queue' && d.impl === 'circular' ? (st.head + j) % d.max : j);
  return out;
}

function tokHTML(X, idx, v, keys) {
  const key = 'v' + v;
  const k = keys.has(key) ? '' : ` data-key="${key}"`;
  keys.add(key);
  return `<div class="tok" data-ref="cell:${X}:${idx}"${k}>${v}</div>`;
}

function cardHTML(s, st, d, view, err, keys) {
  const X = s.name, M = d.max;
  const typeLabel = s.type === 'stack' ? t('stack') : t(d.impl);
  let h = `<div class="card ${s.type}">
    <div class="chead"><span class="sname">${X}</span><span class="stype">${esc(typeLabel)}</span>${statusBoxes(X, st, M, err)}</div>
    ${statusExplain(X, st, M)}`;
  const order = liveOrder(s, st, d);
  if (view === 'graphical') {
    if (s.type === 'stack') {
      let slots = '', ptrs = '';
      for (let i = 0; i < M; i++) {
        slots += `<div class="gslot">${i < st.size ? tokHTML(X, i, st.arr[i], keys) : ''}</div>`;
        ptrs += `<div class="gptr">${i === st.size - 1 ? '← ' + esc(t('top')) : ''}</div>`;
      }
      h += `<div class="gstackwrap"><div class="gstack">${slots}</div><div class="gptrs">${ptrs}</div></div>`;
    } else {
      let slots = '', labels = '';
      for (let j = 0; j < M; j++) {
        slots += `<div class="gslot">${j < order.length ? tokHTML(X, order[j], st.arr[order[j]], keys) : ''}</div>`;
        const lab = [];
        if (j === 0 && order.length) lab.push(t('front'));
        if (j === order.length - 1) lab.push(t('rear'));
        labels += `<span>${esc(lab.join(' / '))}</span>`;
      }
      h += `<div class="gqueue"><div class="gqend">${esc(t('out'))}<br>←</div><div class="gqrow">${slots}</div><div class="gqend">←<br>${esc(t('in'))}</div></div>
        <div class="gqlabels">${labels}</div>`;
    }
  } else {
    h += arrayHTML(s, st, d);
  }
  return h + '</div>';
}

function arrayHTML(s, st, d) {
  const X = s.name, M = d.max, circ = s.type === 'queue' && d.impl === 'circular';
  const tail = s.type === 'queue' ? (circ ? mod(st.head + st.size - 1, M) : st.size - 1) : null;
  let idx = '<div class="lab">idx</div>', val = `<div class="lab">${X}</div>`, mk = '<div></div>', sp = '<div></div>';
  for (let i = 0; i < M; i++) {
    const live = liveIndex(s, st, d, i);
    const v = st.arr[i];
    idx += `<div class="c ix">${i}</div>`;
    val += `<div class="c ${live ? 'live' : v == null ? 'unused' : 'stale'}" data-ref="cell:${X}:${i}">${v == null ? '?' : v}</div>`;
    const marks = [];
    if (s.type === 'stack' && st.size > 0 && i === st.size - 1) marks.push('<span class="m-top">top</span>');
    if (s.type === 'queue') {
      if (circ ? i === st.head : (i === 0 && st.size > 0)) marks.push(`<span class="m-head">${circ ? 'head' : 'front'}</span>`);
      if (st.size > 0 && i === tail) marks.push('<span class="m-tail">tail</span>');
    }
    mk += `<div class="mk">${marks.join('')}</div>`;
    const first = live && (circ ? i === st.head : i === 0);
    sp += `<div class="sp ${live ? 'on' : ''}">${first ? `<span class="splab">size${X} = ${st.size}</span>` : ''}</div>`;
  }
  const wrapped = circ && st.size > 0 && st.head + st.size > M;
  const wrap = circ ? `<div></div><div class="wraprow">${wrapped ? `<div class="wrapline"><span>${esc(t('wraps'))}</span></div>` : ''}</div>` : '';
  let vars = `<span class="vbox"><span class="vn">size${X}</span><span class="vv" data-ref="var:size${X}">${st.size}</span></span>`;
  if (s.type === 'stack') {
    vars += `<span class="vbox"><span class="vn">top${X} = size${X} − 1 =</span><span class="vv dashed" data-ref="der:top${X}">${minus(st.size - 1)}</span></span>`;
  } else if (circ) {
    vars = `<span class="vbox"><span class="vn">head${X}</span><span class="vv" data-ref="var:head${X}">${st.head}</span></span>` + vars;
    vars += `<span class="vbox"><span class="vn">tail${X} = (head${X} + size${X} − 1) mod MAX = (${st.head} + ${st.size} − 1) mod ${M} =</span><span class="vv dashed" data-ref="der:tail${X}">${tail}</span></span>`;
  } else {
    vars += `<span class="vbox"><span class="vn">tail${X} = size${X} − 1 =</span><span class="vv dashed" data-ref="der:tail${X}">${minus(tail)}</span></span>`;
  }
  return `<div class="ascroll"><div class="agrid" style="--n:${M}">${idx}${val}${mk}${sp}${wrap}</div></div>
    <div class="avars">${vars}</div>`;
}

function varPanelHTML(S, err) {
  const box = (name, v, ref, cls = '') => `<span class="vbox"><span class="vn">${name}</span><span class="vv ${cls}${v == null ? ' unset' : ''}${err && err.alert === ref ? ' alert' : ''}" data-ref="${ref}" ${v == null ? `title="${esc(t('notAssigned'))}"` : ''}>${v == null ? '—' : v}</span></span>`;
  let h = `<div class="varpanel">
    <div class="grp"><span class="lbl">${esc(t('variables'))}</span>${VARS.map(v => box(v, S.vars[v], 'var:' + v)).join('')}</div>
    <div class="grp retgrp"><span class="vbox"><span class="vn">return</span><span class="vv ret" data-ref="ret">${S.ret == null ? '' : S.ret}</span></span></div>`;
  if (S.temp != null || S.i != null) {
    h += `<div class="grp locals"><span class="lbl">${esc(t('local'))}</span>`;
    if (S.temp != null) h += box('temp', S.temp, 'temp');
    if (S.i != null) h += box('i', S.i, 'i');
    h += '</div>';
  }
  return h + '</div>';
}

      <button class="cbtn" data-act="back" ${!R || !R.hist.length ? 'disabled' : ''}>${esc(t('back'))}</button>
      <button class="cbtn" data-act="stop" ${!R ? 'disabled' : ''} title="${esc(t('stopTitle'))}">${esc(t('stop'))}</button>
      <button class="cbtn" data-act="newmenu">${esc(t('newBtn'))} ▾</button>
    </div>
    <div class="crow2">
      <button class="tbtn" data-act="speed" title="${esc(t('speed'))}">${esc(t('speed'))}: ${esc(t(app.settings.speed))}</button>
      <span class="keys">${t('keys')}</span>
    </div>
    ${statusHTML(tb)}
    <div class="rfoot">
      <button class="tbtn" data-act="saves">${esc(t('saves'))} (${app.saves.length}/${MAXSAVES})</button>
      <button class="tbtn" data-act="share">${esc(t('share'))}</button>
    </div>`;
  $('#right').innerHTML = h;
}

function lineHTML(ln, i, d, editable) {
  const kindCls = name => { const s = structOf(d, name); return s ? 'k-' + s.type : ''; };
  const chip = (f, txt, cls = '') => editable
    ? `<button class="chip ${cls}" data-act="chip" data-i="${i}" data-f="${f}">${esc(txt)}</button>`
    : `<span class="chip ${cls}">${esc(txt)}</span>`;
  const p = s => `<span class="pun">${s}</span>`;
  if (RETOP[ln.op]) {
    return chip('dest', ln.dest, 'var') + p(' ← ') + chip('op', OPNAME[ln.op]) + p('(') + chip('tgt', ln.t, kindCls(ln.t)) + p(')');
  }
  const a = ln.arg;
  const acls = a.k === 'var' ? 'var' : a.k === 'call' ? kindCls(a.t) : '';
  return chip('op', OPNAME[ln.op]) + p('(') + chip('tgt', ln.t, kindCls(ln.t)) + p(', ') + chip('arg', argText(a), acls) + p(')');
}

function listingHTML(tb, L) {
  const d = tb.demo, ln = d.program[L], rows = listing(ln, d), R = tb.run;
  const notes = {}, just = new Set();
  let next = null, errLi = -1;
  if (R && R.trace.lines[L]) {
    const steps = stepsOf(R, L);
    const n = L < R.line ? steps.length : L === R.line ? R.sub : 0;
    for (let k = 0; k < n; k++) {
      const st = steps[k];
      if (st.error) { errLi = st.li; continue; }
      notes[st.li] = st.note;
      if (st.li2 != null) notes[st.li2] = st.note2;
      if (st.extra) notes[st.extra[0]] = st.extra[1];
    }
    const le = lastExec(R);
    if (le && le.line === L && !steps[le.k].error) {
      just.add(steps[le.k].li);
      if (steps[le.k].li2 != null) just.add(steps[le.k].li2);
    }
    if (L === R.line && !runDone(R, d) && tb.exp === L && steps[R.sub]) next = steps[R.sub].li;
  }
  return `<div class="listing">${rows.map((r, idx) => {
    let bind = '';
    if (r.bind && notes[idx] == null) bind = `<span class="bind">v = ${esc(r.bind.ret ? t('bindRet', { c: r.bind.ret }) : r.bind.txt)}</span>`;
    const note = notes[idx] != null ? `<span class="${r.cls === 'fn' ? 'bind' : 'note'}">${esc(notes[idx])}</span>` : '';
    const cls = [r.cls, just.has(idx) ? 'just' : '', next === idx ? 'next' : '', errLi === idx ? 'errrow' : ''].join(' ');
    return `<div class="lrow ${cls}"><code>${esc(r.t)}</code>${bind}${note}</div>`;
  }).join('')}</div>`;
}

function statusHTML(tb) {
  const d = tb.demo, R = tb.run;
  if (app.notice) {
    const n = app.notice;
    return `<div class="status ${n.bad ? 'err' : 'ok'}" role="status">${esc(t(n.key))}</div>`;
  }
  if (!R) return `<div class="status" role="status">${esc(t(d.program.length ? 'stReady' : 'stEmpty'))}</div>`;
  const e = runError(R);
  if (e) {
    const p = e.params;
    const msg = t(e.key, p);
    const hint = e.key === 'errFull' ? t('hintFull', p) : e.key === 'errEmpty' ? t('hintEmpty', p)
      : t('hintVar', { v: p.v, op: d.tab === 'queue' ? 'Dequeue' : 'Pop' });
    return `<div class="status err" role="alert"><span class="rt">${esc(t('rtLabel'))}</span> — ${esc(t('atLine', { n: R.line + 1 }))}: ${esc(msg)}<span class="hint">💡 ${esc(hint)}</span></div>`;
  }
  const row = (mark, cls, html) => `<div class="srow"><span class="sm ${cls}">${mark}</span><span>${html}</span></div>`;
  let h = '';
  const le = lastExec(R);
  if (le && le.line === R.line) {
    const steps = stepsOf(R, R.line);
    h += row('✓', 'j', `${esc(t('justStep', { n: R.line + 1, s: R.sub, t: steps.length }))} <code>${esc(steps[R.sub - 1].note)}</code>`);
  } else if (le) {
    const ln = d.program[le.line];
    h += row('✓', 'j', `${esc(t('justLine', { n: le.line + 1 }))} <code>${esc(lineText(ln))}</code> → <code>${esc(lineResult(R, le.line, ln))}</code>`);
  }
  if (runFinished(R, d)) return `<div class="status ok" role="status">${h}${row('■', '', esc(t('stDone')))}</div>`;
  h += row('▶', 'n', esc(R.sub > 0 ? t('nextStep', { n: R.line + 1, s: R.sub + 1 }) : t('nextLine', { n: R.line + 1 })));
  return `<div class="status" role="status">${h}</div>`;
}

// Short summary of what a completed line did, e.g. "m = 5" or "A[2] ← 3"
function lineResult(R, i, ln) {
  const steps = stepsOf(R, i);
  if (RETOP[ln.op]) return `${ln.dest} = ${steps[steps.length - 1].S.vars[ln.dest]}`;
  const w = steps.find(s => s.write);
  return w ? w.write : '';
}

/* ======================================================================
   Animation: flying values, FLIP for graphical tokens, flashes for changes
   ====================================================================== */
function captureRects() {
  const refs = {}, keys = {};
  $$('#left [data-ref]').forEach(el => { refs[el.dataset.ref] = el.getBoundingClientRect(); });
  $$('#left [data-key]').forEach(el => { keys[el.dataset.key] = { rect: el.getBoundingClientRect(), text: el.textContent }; });
  return { refs, keys };
}

function diffRefs(a, b, d) {
  const out = new Set();
  for (const s of d.structs) {
    const X = s.name, A = a.st[X], B = b.st[X];
    for (let i = 0; i < d.max; i++) {
      if (A.arr[i] !== B.arr[i] || liveIndex(s, A, d, i) !== liveIndex(s, B, d, i)) out.add(`cell:${X}:${i}`);
    }
    if (A.size !== B.size) ['var:size', 'der:top', 'der:tail'].forEach(p => out.add(p + X));
    if (A.head !== B.head) ['var:head', 'der:tail'].forEach(p => out.add(p + X));
    if ((A.size === 0) !== (B.size === 0)) out.add('isempty:' + X);
    if ((A.size === d.max) !== (B.size === d.max)) out.add('isfull:' + X);
  }
  VARS.forEach(v => { if (a.vars[v] !== b.vars[v]) out.add('var:' + v); });
  ['ret', 'temp', 'i'].forEach(k => { if (a[k] !== b[k] && b[k] != null) out.add(k); });
  return out;
}

function mergeFlies(list) {
  const out = [];
  for (const [f, to] of list) {
    const prev = (f === 'ret' || f === 'temp') ? out.find(x => x[1] === f) : null;
    if (prev) prev[1] = to; else out.push([f, to]);
  }
  return out;
}

function update(anim) {
  // a new step cancels any animation still in flight (fast clicking)
  $$('.ghost').forEach(g => g.remove());
  const before = anim ? captureRects() : null;
  renderAll();
  persist();
  if (anim) animate(before, anim);
}

function animate(before, { prev, next, flies }) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const dur = Math.round(600 * SPEEDS[app.settings.speed]);
  const d = T().demo;
  const graphical = app.settings.view === 'graphical';
  const landing = new Set(), sources = new Set();
  const cellOf = r => (r.startsWith('cell:') ? r.split(':')[1] : null);

  for (const [from, to] of flies) {
    if (graphical && cellOf(from) && cellOf(from) === cellOf(to)) continue; // FLIP handles moves inside a structure
    const r0 = before.refs[from];
    const el = $(`#left [data-ref="${to}"]`);
    if (!r0 || !el) continue;
    const r1 = el.getBoundingClientRect();
    landing.add(to); sources.add(from);
    const g = document.createElement('div');
    g.className = 'ghost';
    g.textContent = el.textContent;
    document.body.appendChild(g);
    el.style.visibility = 'hidden';
    const lift = Math.min(r0.top, r1.top) - 36;
    const kf = [
      { left: r0.left + 'px', top: r0.top + 'px', width: r0.width + 'px', height: r0.height + 'px' },
      { left: (r0.left + r1.left) / 2 + 'px', top: lift + 'px', width: (r0.width + r1.width) / 2 + 'px', height: (r0.height + r1.height) / 2 + 'px', offset: 0.5 },
      { left: r1.left + 'px', top: r1.top + 'px', width: r1.width + 'px', height: r1.height + 'px' },
    ];
    const a = g.animate(kf, { duration: dur * 1.3, easing: 'cubic-bezier(.45,0,.25,1)', fill: 'forwards' });
    a.onfinish = () => { g.remove(); el.style.visibility = ''; el.classList.add('flash'); };
  }

  if (graphical) {
    const seen = new Set();
    $$('#left [data-key]').forEach(el => {
      const k = el.dataset.key; seen.add(k);
      if (landing.has(el.dataset.ref)) return;
      const old = before.keys[k];
      if (old) {
        const r = el.getBoundingClientRect();
        const dx = old.rect.left - r.left, dy = old.rect.top - r.top;
        if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
          el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: dur, easing: 'cubic-bezier(.3,0,.2,1)' });
        }
      } else {
        el.animate([{ transform: 'translateY(-1.2rem) scale(.6)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: dur, easing: 'ease-out' });
      }
    });
    // tokens that disappeared without flying anywhere fade out in place
    Object.entries(before.keys).forEach(([k, o]) => {
      if (seen.has(k)) return;
      const fromRef = [...sources].some(s => before.refs[s] && before.refs[s].left === o.rect.left && before.refs[s].top === o.rect.top);
      if (fromRef) return;
      const g = document.createElement('div');
      g.className = 'ghost';
      g.textContent = o.text;
      Object.assign(g.style, { left: o.rect.left + 'px', top: o.rect.top + 'px', width: o.rect.width + 'px', height: o.rect.height + 'px' });
      document.body.appendChild(g);
      g.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(-1rem)' }], { duration: dur, fill: 'forwards' }).onfinish = () => g.remove();
    });
  }

  if (prev && next) {
    diffRefs(prev, next, d).forEach(ref => {
      if (landing.has(ref)) return;
      const el = $(`#left [data-ref="${ref}"]`);
      if (el) el.classList.add('flash');
    });
  }
}

/* ======================================================================
   Actions
   ====================================================================== */
function editDemo(fn) {
  const tb = T();
  if (tb.run) return;
  fn(tb.demo);
  app.notice = null;
  update(null);
}
// A program edit makes a generated program the student's own.
function editProgram(fn) { editDemo(d => { fn(d); d.generated = false; }); }
// A setup change can break a generated program (new contents, fewer structures),
// so an untouched generated program is regenerated to stay error-free.
function editSetup(fn) {
  editDemo(d => {
    const gen = d.generated;
    if (gen) d.program = [];
    fn(d);
    if (gen) { d.program = randomProgram(d); T().exp = -1; }
  });
}

function newLine(d) {
  const s = d.structs[0];
  const free = freeValues(d);
  return { op: INSERT_OF[s.type], t: s.name, arg: free.length ? { k: 'num', v: pick(free) } : { k: 'var', n: 'm' } };
}

function doRun() {
  const tb = T(), d = tb.demo;
  if (!d.program.length) return;
  if (!tb.run) tb.run = { trace: buildTrace(d), line: 0, sub: 0, hist: [] };
  const R = tb.run;
  if (runDone(R, d)) return;
  app.notice = null;
  const prev = displayState(tb);
  const steps = stepsOf(R, R.line);
  R.hist.push({ line: R.line, sub: R.sub });
  const from = R.sub;
  R.sub = tb.exp === R.line ? R.sub + 1 : steps.length;
  const applied = steps.slice(from, R.sub);
  const last = steps[R.sub - 1];
  if (R.sub >= steps.length && !last.error) { R.line++; R.sub = 0; }
  const flies = applied.length > 1 ? mergeFlies(applied.flatMap(s => s.flies)) : applied[0].flies;
  update({ prev, next: displayState(tb), flies });
}

function doBack() {
  const tb = T(), R = tb.run;
  if (!R || !R.hist.length) return;
  const prev = displayState(tb);
  Object.assign(R, R.hist.pop());
  update({ prev, next: displayState(tb), flies: [] });
}

function doReset() {
  const tb = T();
  if (!tb.run) return;
  const prev = displayState(tb);
  tb.run = null;
  update({ prev, next: displayState(tb), flies: [] });
}

function doRestart(random) {
  const tb = T();
  tb.demo = newDemo(app.tab, tb.demo);
  if (random) tb.demo.program = randomProgram(tb.demo);
  tb.demo.generated = !!random;
  tb.run = null;
  tb.exp = -1;
  app.notice = null;
  update(null);
}

/* ---------- popup menu ---------- */
let menuCtx = null;
function openMenu(anchor, html, ctx) {
  const m = $('#menu');
  m.innerHTML = html;
  m.hidden = false;
  menuCtx = ctx;
  const r = anchor.getBoundingClientRect();
  const mw = m.offsetWidth, mh = m.offsetHeight;
  let left = r.left + window.scrollX;
  left = Math.max(8 + window.scrollX, Math.min(left, window.scrollX + document.documentElement.clientWidth - mw - 8));
  let top = r.bottom + window.scrollY + 4;
  if (r.bottom + mh + 8 > window.innerHeight && r.top - mh - 4 > 0) top = r.top + window.scrollY - mh - 4;
  m.style.left = left + 'px';
  m.style.top = top + 'px';
  const first = $('button.sel, button:not(:disabled)', m);
  if (first) first.focus({ preventScroll: true });
}
function closeMenu() { $('#menu').hidden = true; menuCtx = null; }

function chipMenu(anchor, i, f) {
  const d = T().demo, ln = d.program[i];
  const btn = (val, label, sel, dis = false, cls = '') =>
    `<button data-act="pick" data-val="${esc(JSON.stringify(val))}" class="${sel ? 'sel' : ''} ${cls}" ${dis ? 'disabled' : ''}>${esc(label)}</button>`;
  let h = '';
  if (f === 'op') {
    const kinds = kindsAllowed(d.tab);
    h = `<div class="mh">${esc(t('mOp'))}</div><div class="mlist">` +
      ['push', 'pop', 'enqueue', 'dequeue'].filter(op => kinds.includes(KIND[op]))
        .map(op => btn(op, OPNAME[op], ln.op === op, !d.structs.some(s => s.type === KIND[op]))).join('') + '</div>';
  } else if (f === 'tgt') {
    h = `<div class="mh">${esc(t('mStruct'))}</div><div class="mlist">` +
      d.structs.filter(s => s.type === KIND[ln.op]).map(s => btn(s.name, s.name, ln.t === s.name)).join('') + '</div>';
  } else if (f === 'dest') {
    h = `<div class="mh">${esc(t('mStore'))}</div><div class="mlist">` + VARS.map(v => btn(v, v, ln.dest === v)).join('') + '</div>';
  } else if (f === 'arg') {
    const used = usedValues(d, i);
    const a = ln.arg;
    h = `<div class="mh">${esc(t('mNumber'))}</div><div class="mgrid">` +
      range(VMIN, VMAX).map(v => btn({ k: 'num', v }, String(v), a.k === 'num' && a.v === v, used.has(v))).join('') + '</div>' +
      `<div class="mh">${esc(t('mVariable'))}</div><div class="mlist">` +
      VARS.map(v => btn({ k: 'var', n: v }, v, a.k === 'var' && a.n === v)).join('') + '</div>' +
      `<div class="mh">${esc(t('mReturned'))}</div><div class="mlist">` +
      d.structs.map(s => { const op = REMOVE_OF[s.type]; return btn({ k: 'call', op, t: s.name }, `${OPNAME[op]}(${s.name})`, a.k === 'call' && a.t === s.name); }).join('') + '</div>';
  }
  openMenu(anchor, h, { kind: 'chip', i, f });
}

function applyPick(val) {
  const { i, f } = menuCtx;
  closeMenu();
  editProgram(d => {
    const ln = d.program[i];
    if (f === 'op') {
      if (KIND[val] !== KIND[ln.op]) ln.t = d.structs.find(s => s.type === KIND[val]).name;
      ln.op = val;
      if (RETOP[val]) {
        delete ln.arg;
        if (!ln.dest) {
          const usedDest = new Set(d.program.map(x => x.dest).filter(Boolean));
          ln.dest = VARS.find(v => !usedDest.has(v)) || 'm';
        }
      } else {
        delete ln.dest;
        if (!ln.arg) { const free = freeValues(d, i); ln.arg = free.length ? { k: 'num', v: pick(free) } : { k: 'var', n: 'm' }; }
      }
    } else if (f === 'tgt') ln.t = val;
    else if (f === 'dest') ln.dest = val;
    else if (f === 'arg') ln.arg = val;
  });
}

/* ======================================================================
   Events
   ====================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (!e.target.closest('#menu')) closeMenu(); return; }
  if (el.disabled) return;
  const act = el.dataset.act;
  if (!el.closest('#menu')) closeMenu();
  const tb = T();
  switch (act) {
    case 'tab': app.tab = el.dataset.tab; app.notice = null; update(null); break;
    case 'view': app.settings.view = el.dataset.v; update(null); break;
    case 'lang': app.settings.lang = app.settings.lang === 'en' ? 'zh' : 'en'; update(null); break;
    case 'theme': app.settings.theme = app.settings.theme === 'light' ? 'dark' : 'light'; update(null); break;
    case 'speed': { const k = Object.keys(SPEEDS); app.settings.speed = k[(k.indexOf(app.settings.speed) + 1) % k.length]; update(null); break; }
    case 'zoom': app.settings.zoom = Math.round(Math.min(1.8, Math.max(0.7, app.settings.zoom + 0.1 * +el.dataset.d)) * 10) / 10; update(null); break;
    case 'stat': app.open[el.dataset.key] = !app.open[el.dataset.key]; update(null); break;
    case 'max':
      editSetup(d => { d.max = Math.min(CAP_MAX, Math.max(CAP_MIN, d.max + +el.dataset.d)); fillContents(d); });
      break;
    case 'impl':
      editSetup(d => { if (d.impl !== el.dataset.v) { d.impl = el.dataset.v; fillContents(d, d.structs.filter(s => s.type === 'queue')); } });
      break;
    case 'addst':
      editSetup(d => {
        if (d.structs.length >= MAXSTRUCTS) return;
        const name = nextName(d, el.dataset.type);
        if (!name) return;
        const s = { name, type: el.dataset.type };
        d.structs.push(s);
        d.structs.sort((a, b) => (a.type === b.type ? a.name.localeCompare(b.name) : a.type === 'stack' ? -1 : 1));
        fillContents(d, [s]);
      });
      break;
    case 'delst':
      editSetup(d => {
        const X = el.dataset.name;
        d.structs = d.structs.filter(s => s.name !== X);
        d.program = d.program.filter(ln => ln.t !== X && !(ln.arg && ln.arg.k === 'call' && ln.arg.t === X));
        tb.exp = -1;
      });
      break;
    case 'addline': editProgram(d => { if (d.program.length < MAXLINES) d.program.push(newLine(d)); }); break;
    case 'delline': editProgram(d => { d.program.splice(+el.dataset.i, 1); tb.exp = -1; }); break;
    case 'exp': tb.exp = tb.exp === +el.dataset.i ? -1 : +el.dataset.i; update(null); break;
    case 'chip': chipMenu(el, +el.dataset.i, el.dataset.f); break;
    case 'pick': if (menuCtx) applyPick(JSON.parse(el.dataset.val)); break;
    case 'run': doRun(); break;
    case 'back': doBack(); break;
    case 'stop': doReset(); break;
    case 'newmenu':
      openMenu(el, `<button class="wide" data-act="restartpick" data-random="0">${esc(t('restartEmpty'))}</button>
        <button class="wide" data-act="restartpick" data-random="1">${esc(t('restartRandom'))}</button>
        <button class="wide" data-act="resetall">${esc(t('resetAll'))}</button>`, { kind: 'new' });
      break;
    case 'resetall':
      closeMenu();
      if (confirm(t('confirmResetAll'))) {
        app.tabs[app.tab] = { demo: newDemo(app.tab), run: null, exp: -1 };
        app.notice = null;
        update(null);
      }
      break;
    case 'restartpick': closeMenu(); doRestart(el.dataset.random === '1'); break;
    case 'saves': savesDialog(); break;
    case 'share': shareDialog(); break;
    case 'copy': copyShare(el); break;
    case 'dclose': $('#dlg').close(); break;
    case 'savecur':
      if (app.saves.length < MAXSAVES) { app.saves.unshift({ when: Date.now(), demo: clone(tb.demo) }); persist(); renderRight(); savesDialog(); }
      break;
    case 'delsave': app.saves.splice(+el.dataset.i, 1); persist(); renderRight(); savesDialog(); break;
    case 'loadsave': {
      const d = clone(app.saves[+el.dataset.i].demo);
      app.tab = d.tab;
      app.tabs[d.tab] = { demo: d, run: null, exp: -1 };
      $('#dlg').close();
      update(null);
      break;
    }
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeMenu(); return; }
  if ($('#dlg').open || !$('#menu').hidden) return;
  if (e.target.closest('input, textarea, select')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); doRun(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); doBack(); }
});
window.addEventListener('resize', closeMenu);

restore();
renderAll();
persist();
</script>
</body>
</html>
